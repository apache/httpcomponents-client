name: Java CI

on:
  push:
    branches:
      - master
      - '5.*'
      - '4.*'
      - 'feature/*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 8 for compilation and tests
      id: setup-java-toolchain
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'temurin'
        java-version: '8'
    - name: Set up JDK 17 for Maven
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'
    - name: Configure Maven toolchain
      env:
        TOOLCHAIN_JAVA_HOME: ${{ steps.setup-java-toolchain.outputs.path }}
      run: |
        # The parent selects the toolchain by maven.compiler.source (1.6).
        # JDK 8 supports that source level and the dependencies' Java 8 requirement.
        mkdir -p "${HOME}/.m2"
        cat > "${HOME}/.m2/toolchains.xml" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <toolchains>
          <toolchain>
            <type>jdk</type>
            <provides>
              <version>1.6</version>
            </provides>
            <configuration>
              <jdkHome>${TOOLCHAIN_JAVA_HOME}</jdkHome>
            </configuration>
          </toolchain>
        </toolchains>
        EOF
    - name: Build with Maven
      run: mvn -B -V --no-transfer-progress -DtrimStackTrace=false clean verify
